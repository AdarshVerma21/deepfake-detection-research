project:
  name: deepfake-detection-research
  experiment_name: baseline_efficientnet_b0

runtime:
  seed: 42
  device: auto         # auto | cpu | cuda
  mixed_precision: true
  num_workers: 4

training:
  task: video_frame_detection
  class_imbalance_mode: none  # none | weighted_loss
  image_size: 224
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 20
  scheduler: cosine     # cosine | step | plateau | none
  scheduler_step_size: 5
  scheduler_gamma: 0.1
  early_stopping_patience: 5
  gradient_clip_norm: 1.0

model:
  name: efficientnet_b0   # efficientnet_b0 | xception
  num_classes: 1          # one logit; labels remain real=0 and fake=1
  pretrained: false       # downloads are never performed automatically
  weights_path: null      # optional local ImageNet/Xception checkpoint

paths:
  train_images: data/processed/images/train
  val_images: data/processed/images/val
  test_images: data/processed/images/test
  train_frames: data/processed/frames/train
  val_frames: data/processed/frames/val
  test_frames: data/processed/frames/test
  external_eval: data/external/celeb_df_v2
  checkpoints: outputs/checkpoints
  logs: outputs/logs
  results: results

explainability:
  grad_cam_target_layers:
    efficientnet_b0: features.8.0
    xception: features.9.main.2.block.3

robustness:
  jpeg_qualities: [95, 75, 50]
  gaussian_noise_stds: [0.01, 0.03, 0.05]
  gaussian_blur_kernels: [3, 5, 7]
  downscale_ratios: [0.75, 0.5, 0.25]
