dataset:
  image_detection:
    train_csv: data/metadata/image_train.csv
    val_csv: data/metadata/image_val.csv
    test_csv: data/metadata/image_test.csv
    image_column: filepath
    label_column: label

  video_frame_detection:
    train_csv: data/metadata/frame_train.csv
    val_csv: data/metadata/frame_val.csv
    test_csv: data/metadata/frame_test.csv
    frame_column: filepath
    label_column: label

labels:
  0: real
  1: fake

external_validation:
  celeb_df_v2_csv: data/external/celeb_df_v2/metadata.csv

faceforensics:
  dataset_root: data/raw/faceforensics
  output_dir: data/processed/faceforensics_c23
  split_dir: data/raw/faceforensics/splits
  frames_per_video: 5
  crop_size: 224
  detector: haar
  sampling_strategy: uniform
  seed: 42
  categories:
    - original
    - Deepfakes
    - Face2Face
    - FaceSwap
    - NeuralTextures
