experiments:
  efficientnet_b0_images:
    task: image_detection
    model: efficientnet_b0
    grad_cam_target_layer: features.8

  xception_images:
    task: image_detection
    model: xception
    grad_cam_target_layer: model.conv4

  efficientnet_b0_frames:
    task: video_frame_detection
    model: efficientnet_b0
    grad_cam_target_layer: features.8

  xception_frames:
    task: video_frame_detection
    model: xception
    grad_cam_target_layer: model.conv4

robustness:
  clean_baseline: true
  jpeg_qualities: [95, 75, 50]
  gaussian_noise_stds: [0.01, 0.03, 0.05]
  gaussian_blur_kernels: [3, 5, 7]
  downscale_ratios: [0.75, 0.5, 0.25]
